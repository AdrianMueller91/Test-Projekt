# Grundeinstellungen. Lokal ohne weitere Angaben: H2 im Speicher und Zufallspasswort im Log.
# Auf dem Server gilt zusätzlich application-prod.yaml (Postgres, Passwort Pflicht).
spring:
  application:
    name: test-projekt
  datasource:
    # PostgreSQL-Modus, damit die Flyway-Migrationen lokal und auf dem Server gleich laufen
    url: jdbc:h2:mem:testprojekt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  mvc:
    problemdetails:
      enabled: true

server:
  # Fehlermeldungen ohne Stacktrace und interne Details nach außen
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:}
    require-password: false
